name: Route Art

# Tests Route Art on every push that touches it. On the default branch it also
# publishes the app to GitHub Pages at https://<owner>.github.io/<repo>/RouteArt/
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    paths:
      - "RouteArt/**"
      - ".github/workflows/route-art.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RouteArt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}RouteArt/
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (only the app, not the tests)
        run: |
          mkdir -p _site/RouteArt
          cp RouteArt/index.html _site/RouteArt/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
